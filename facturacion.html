<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Facturación Posventa</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400;0,700;0,900;1,900&display=swap');
        
        body { font-family: 'Montserrat', sans-serif; background: #f4f7f6; margin: 0; padding: 20px; color: #1e293b; }
        .container { max-width: 1400px; margin: auto; }
        
        .header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 30px; }
        .header-title { display: flex; align-items: center; gap: 15px; font-size: 1.5rem; font-weight: 900; font-style: italic; text-transform: uppercase; }
        .back-btn { background: white; border: none; width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; box-shadow: 0 4px 6px rgba(0,0,0,0.05); text-decoration: none; color: #1e293b; font-weight: bold; }
        
        /* Grid Superior: Objetivo, Avance, Desvío */
        .top-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-bottom: 30px; }
        
        .data-card { background: white; border-radius: 20px; padding: 30px; box-shadow: 0 10px 20px rgba(0,0,0,0.03); position: relative; overflow: hidden; }
        .data-card.dark { background: #1e293b; color: white; }
        
        .card-header { display: flex; align-items: center; gap: 10px; font-size: 0.8rem; font-weight: 700; color: #64748b; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 20px; }
        .dark .card-header { color: #94a3b8; }
        
        .list-item { display: flex; justify-content: space-between; margin-bottom: 15px; font-size: 0.85rem; font-weight: 700; color: #64748b; }
        .dark .list-item { color: #94a3b8; }
        .list-val { font-size: 1.1rem; font-weight: 900; font-style: italic; color: #1e293b; }
        .dark .list-val { color: white; }
        
        .consolidado { border-top: 1px solid #e2e8f0; padding-top: 15px; margin-top: 15px; }
        .dark .consolidado { border-top: 1px solid rgba(255,255,255,0.1); }
        .consolidado-val { font-size: 1.5rem; }
        
        /* Grid Inferior: Semáforos de Cumplimiento */
        .gauge-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
        .gauge-card { background: #0b1121; border-radius: 20px; padding: 25px; color: white; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 10px 20px rgba(0,0,0,0.1); }
        
        .gauge-info h3 { font-size: 0.7rem; color: #64748b; text-transform: uppercase; letter-spacing: 2px; margin: 0 0 10px 0; }
        .gauge-pct { font-size: 3rem; font-weight: 900; font-style: italic; margin: 0; line-height: 1; }
        
        .chart-wrapper { width: 90px; height: 45px; position: relative; }
        
        /* Colores dinámicos */
        .text-green { color: #2ecc71 !important; }
        .text-yellow { color: #f1c40f !important; }
        .text-red { color: #e74c3c !important; }
        
        #loading { text-align: center; padding: 50px; font-weight: bold; color: #3b82f6; }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <div class="header-title">
                <a href="index.html" class="back-btn">←</a>
                <span>📊 Facturación Posventa</span>
            </div>
        </div>

        <div id="loading">Sincronizando con Google Sheets... ⏳</div>

        <div id="dashboard" style="display: none;">
            
            <div class="top-grid">
                <!-- Tarjeta Objetivo -->
                <div class="data-card">
                    <div class="card-header">🎯 OBJETIVO FACTURACIÓN</div>
                    <div id="obj-list"></div>
                </div>

                <!-- Tarjeta Avance -->
                <div class="data-card">
                    <div class="card-header">💲 AVANCE A FECHA</div>
                    <div id="ava-list"></div>
                </div>

                <!-- Tarjeta Desvío -->
                <div class="data-card dark">
                    <div class="card-header">⚠️ DESVÍO A FECHA</div>
                    <div id="des-list"></div>
                </div>
            </div>

            <div class="gauge-grid" id="gauge-container">
                <!-- Los medidores de cumplimiento se inyectan aquí -->
            </div>

        </div>
    </div>

    <script>
        // PEGA AQUÍ TU ENLACE DE APPS SCRIPT
        const scriptUrl ="https://script.google.com/macros/s/AKfycbyQl9HqhxTz-lowrEi62c3rEE7CoLtpFWewgbu0CCLg9rxfNbtn_QIeoAM6OBNB_39c/exec"
        const formatMoney = (n) => {
            if (n >= 1000000 || n <= -1000000) return '$ ' + (n / 1000000).toFixed(1) + 'M';
            return new Intl.NumberFormat('es-AR', { style: 'currency', currency: 'ARS', maximumFractionDigits: 0 }).format(n);
        };

        const getStatusColor = (pct) => {
            if (pct >= 95) return '#2ecc71'; // Verde
            if (pct >= 90) return '#f1c40f'; // Amarillo
            return '#e74c3c'; // Rojo
        };

        const renderList = (data, type) => {
            let html = '';
            const sucursales = ['SANTA FE', 'JUJUY', 'EXPRESS', 'MOVIL', 'TARTAGAL'];
            
            sucursales.forEach(suc => {
                let obj = data.sucursales[suc].objetivo;
                let ava = data.sucursales[suc].avance;
                let val = type === 'obj' ? obj : type === 'ava' ? ava : (ava - obj);
                html += `<div class="list-item"><span>${suc}</span> <span class="list-val">${formatMoney(val)}</span></div>`;
            });

            let cObj = data.consolidado.objetivo;
            let cAva = data.consolidado.avance;
            let cVal = type === 'obj' ? cObj : type === 'ava' ? cAva : (cAva - cObj);
            
            html += `<div class="list-item consolidado"><span>CONSOLIDADO</span> <span class="list-val consolidado-val">${formatMoney(cVal)}</span></div>`;
            return html;
        };

        const createGauge = (id, name, pct) => {
            let color = getStatusColor(pct);
            let colorClass = pct >= 95 ? 'text-green' : pct >= 90 ? 'text-yellow' : 'text-red';
            
            let html = `
                <div class="gauge-card">
                    <div class="gauge-info">
                        <h3>CUMPLIMIENTO ${name}</h3>
                        <p class="gauge-pct ${colorClass}">${pct.toFixed(0)}%</p>
                    </div>
                    <div class="chart-wrapper">
                        <canvas id="gauge-${id}"></canvas>
                    </div>
                </div>
            `;
            document.getElementById('gauge-container').insertAdjacentHTML('beforeend', html);

            new Chart(document.getElementById(`gauge-${id}`).getContext('2d'), {
                type: 'doughnut',
                data: {
                    datasets: [{
                        data: [pct > 100 ? 100 : pct, pct > 100 ? 0 : 100 - pct],
                        backgroundColor: [color, '#1e293b'],
                        borderWidth: 0,
                        circumference: 180,
                        rotation: 270
                    }]
                },
                options: { responsive: true, maintainAspectRatio: false, cutout: '75%', plugins: { tooltip: { enabled: false } }, hover: { mode: null } }
            });
        };

        fetch(scriptUrl)
            .then(res => res.json())
            .then(data => {
                document.getElementById('loading').style.display = 'none';
                document.getElementById('dashboard').style.display = 'block';

                let fac = data.facturacion;

                // Llenar listas superiores
                document.getElementById('obj-list').innerHTML = renderList(fac, 'obj');
                document.getElementById('ava-list').innerHTML = renderList(fac, 'ava');
                document.getElementById('des-list').innerHTML = renderList(fac, 'des');

                // Crear medidores
                const sucursales = ['SANTA FE', 'JUJUY', 'EXPRESS', 'MOVIL', 'TARTAGAL'];
                sucursales.forEach((suc, idx) => {
                    let obj = fac.sucursales[suc].objetivo;
                    let ava = fac.sucursales[suc].avance;
                    let pct = obj > 0 ? (ava / obj) * 100 : 0;
                    createGauge(idx, suc, pct);
                });

                // Consolidado Total
                let cPct = fac.consolidado.objetivo > 0 ? (fac.consolidado.avance / fac.consolidado.objetivo) * 100 : 0;
                createGauge('total', 'TOTAL', cPct);
            });
    </script>
</body>
</html>
