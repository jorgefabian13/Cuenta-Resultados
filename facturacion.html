<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Facturación</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,500;0,700;0,900;1,800&display=swap');
        
        body { 
            font-family: 'Montserrat', sans-serif; 
            background: #0b1121; /* Fondo global oscuro y elegante */
            margin: 0; padding: 30px; color: #f8fafc; 
        }
        .container { max-width: 1400px; margin: auto; }
        
        /* Cabecera */
        .header { display: flex; align-items: center; gap: 20px; margin-bottom: 30px; }
        .back-btn { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); width: 45px; height: 45px; border-radius: 12px; display: flex; align-items: center; justify-content: center; cursor: pointer; text-decoration: none; color: white; font-weight: bold; font-size: 1.2rem; transition: all 0.3s; }
        .back-btn:hover { background: rgba(255,255,255,0.1); transform: translateX(-3px); }
        .header-title { font-size: 2.2rem; font-weight: 900; letter-spacing: -1px; margin: 0; color: white; text-transform: uppercase; font-style: italic; text-shadow: 0 0 20px rgba(0, 176, 240, 0.3); }
        
        /* Panel de Filtros Premium */
        .filters-panel { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(10px); border-radius: 16px; padding: 25px; margin-bottom: 30px; border: 1px solid rgba(255,255,255,0.05); box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .filter-row { display: flex; flex-wrap: wrap; gap: 40px; margin-bottom: 20px; align-items: flex-start; }
        .filter-row:last-child { margin-bottom: 0; border-top: 1px solid rgba(255,255,255,0.05); padding-top: 20px; }
        
        .filter-group { display: flex; flex-direction: column; gap: 12px; }
        .filter-label { font-size: 0.75rem; font-weight: 700; color: #94a3b8; text-transform: uppercase; letter-spacing: 1px; }
        .filter-options { display: flex; gap: 8px; flex-wrap: wrap; }
        
        .f-btn { background: rgba(15, 23, 42, 0.6); border: 1px solid rgba(255,255,255,0.1); padding: 8px 16px; border-radius: 8px; font-family: inherit; font-size: 0.75rem; font-weight: 700; color: #cbd5e1; cursor: pointer; transition: all 0.2s; text-transform: uppercase; }
        .f-btn:hover { background: rgba(255,255,255,0.1); color: white; }
        .f-btn.active { background: #00b0f0; color: white; border-color: #00b0f0; box-shadow: 0 0 15px rgba(0, 176, 240, 0.4); }
        
        /* Tarjetas de Datos */
        .top-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 25px; margin-bottom: 30px; }
        .data-card { background: rgba(30, 41, 59, 0.5); border-radius: 16px; padding: 25px; border: 1px solid rgba(255,255,255,0.05); transition: transform 0.3s; }
        .data-card:hover { transform: translateY(-5px); background: rgba(30, 41, 59, 0.8); }
        .data-card.highlight { border-color: rgba(239, 68, 68, 0.3); background: rgba(239, 68, 68, 0.05); }
        
        .card-header { font-size: 0.85rem; font-weight: 800; color: #94a3b8; text-transform: uppercase; letter-spacing: 1.5px; margin-bottom: 25px; display: flex; align-items: center; gap: 8px; border-bottom: 1px solid rgba(255,255,255,0.05); padding-bottom: 10px; }
        
        .list-item { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; font-size: 0.85rem; font-weight: 600; color: #cbd5e1; }
        .list-val { font-size: 1.3rem; font-weight: 900; color: white; font-style: italic; letter-spacing: 0.5px; }
        
        .consolidado { border-top: 2px dashed rgba(255,255,255,0.1); padding-top: 15px; margin-top: 15px; }
        .consolidado-val { font-size: 1.8rem; color: #00b0f0; text-shadow: 0 0 10px rgba(0, 176, 240, 0.3); }
        .highlight .consolidado-val { color: #ef4444; text-shadow: 0 0 10px rgba(239, 68, 68, 0.3); }
        
        /* Semáforos Circulares (Gráficos) */
        .gauge-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 25px; }
        .gauge-card { background: rgba(15, 23, 42, 0.8); border-radius: 16px; padding: 25px; display: flex; justify-content: space-between; align-items: center; border: 1px solid rgba(255,255,255,0.05); transition: transform 0.3s; position: relative; overflow: hidden; }
        .gauge-card:hover { transform: scale(1.02); border-color: rgba(255,255,255,0.2); }
        
        .gauge-info h3 { font-size: 0.8rem; color: #94a3b8; text-transform: uppercase; letter-spacing: 2px; margin: 0 0 5px 0; font-weight: 800; }
        .gauge-pct { font-size: 3.5rem; font-weight: 900; margin: 0; line-height: 1; font-style: italic; text-shadow: 0 0 20px currentColor; } /* Glow effect */
        
        .chart-wrapper { width: 110px; height: 55px; position: relative; }
        
        .text-green { color: #10b981 !important; }
        .text-yellow { color: #f59e0b !important; }
        .text-red { color: #ef4444 !important; }
        
        #loading { text-align: center; padding: 100px; font-size: 1.2rem; font-weight: 700; color: #00b0f0; }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <a href="index.html" class="back-btn">←</a>
            <h1 class="header-title">FACTURACIÓN POSVENTA</h1>
        </div>

        <div id="loading">Sincronizando con Autosol... ⏳</div>

        <div id="dashboard" style="display: none;">
            <div class="filters-panel">
                <div class="filter-row">
                    <div class="filter-group">
                        <span class="filter-label">📅 AÑO</span>
                        <div class="filter-options" id="filter-ano">
                            <button class="f-btn" data-val="TODOS">HISTÓRICO</button>
                            <button class="f-btn" data-val="2025">2025</button>
                            <button class="f-btn active" data-val="2026">2026</button>
                        </div>
                    </div>
                    <div class="filter-group">
                        <span class="filter-label">📍 SUCURSALES</span>
                        <div class="filter-options" id="filter-sucursales">
                            <button class="f-btn active" data-val="TODAS">TODAS</button>
                            <button class="f-btn" data-val="JUJUY">Jujuy</button>
                            <button class="f-btn" data-val="EXPRESS">Express</button>
                            <button class="f-btn" data-val="MOVIL">Movil</button>
                            <button class="f-btn" data-val="SANTA FE">Santa Fe</button>
                            <button class="f-btn" data-val="TARTAGAL">Tartagal</button>
                        </div>
                    </div>
                    <div class="filter-group">
                        <span class="filter-label">💼 ÁREAS</span>
                        <div class="filter-options" id="filter-areas">
                            <button class="f-btn active" data-val="TODAS">TODAS</button>
                            <button class="f-btn" data-val="ACCESORIOS">Accesorios</button>
                            <button class="f-btn" data-val="REPUESTOS">Repuestos</button>
                            <button class="f-btn" data-val="SERVICIOS">Servicios</button>
                        </div>
                    </div>
                </div>
                <div class="filter-row">
                    <div class="filter-group">
                        <span class="filter-label">🕒 MESES</span>
                        <div class="filter-options" id="filter-meses">
                            <button class="f-btn" data-val="TODOS">ANUAL</button>
                            <button class="f-btn" data-val="ENERO">Ene</button>
                            <button class="f-btn" data-val="FEBRERO">Feb</button>
                            <button class="f-btn" data-val="MARZO">Mar</button>
                            <button class="f-btn" data-val="ABRIL">Abr</button>
                            <button class="f-btn" data-val="MAYO">May</button>
                            <button class="f-btn" data-val="JUNIO">Jun</button>
                            <button class="f-btn" data-val="JULIO">Jul</button>
                            <button class="f-btn" data-val="AGOSTO">Ago</button>
                            <button class="f-btn active" data-val="SEPTIEMBRE">Sep</button>
                            <button class="f-btn" data-val="OCTUBRE">Oct</button>
                            <button class="f-btn" data-val="NOVIEMBRE">Nov</button>
                            <button class="f-btn" data-val="DICIEMBRE">Dic</button>
                        </div>
                    </div>
                </div>
            </div>

            <div class="top-grid">
                <div class="data-card"><div class="card-header">🎯 OBJETIVO</div><div id="obj-list"></div></div>
                <div class="data-card"><div class="card-header">💲 AVANCE</div><div id="ava-list"></div></div>
                <div class="data-card highlight"><div class="card-header">⚠️ DESVÍO</div><div id="des-list"></div></div>
            </div>
            
            <div class="gauge-grid" id="gauge-container"></div>
        </div>
    </div>

    <script>
        // PEGA AQUÍ TU ENLACE DE APPS SCRIPT
        const scriptUrl ="https://script.google.com/macros/s/AKfycbzWnckM7zCpCNDd47KEQL_5gzPygUoXtoPP0CM9foyzaqfdeooNT6hnc2SKUZ5tGaeL/exec"

        let rawData = [];
        let currentFilters = { ano: '2026', sucursal: 'TODAS', area: 'TODAS', mes: 'SEPTIEMBRE' };

        const formatMoney = (n) => {
            let isNeg = n < 0; let val = Math.abs(n) / 1000000;
            return (isNeg ? '-$ ' : '$ ') + val.toFixed(1) + 'M';
        };

        const getStatusColor = (pct) => {
            if (pct >= 95) return '#10b981'; 
            if (pct >= 90) return '#f59e0b'; 
            return '#ef4444'; 
        };

        function processData() {
            let filtered = rawData.filter(row => {
                let matchAno = currentFilters.ano === 'TODOS' || row.ano === currentFilters.ano;
                let matchSucursal = currentFilters.sucursal === 'TODAS' || row.sucursal.includes(currentFilters.sucursal);
                let matchArea = currentFilters.area === 'TODAS' || row.area === currentFilters.area;
                let matchMes = currentFilters.mes === 'TODOS' || row.mes === currentFilters.mes;
                return matchAno && matchSucursal && matchArea && matchMes;
            });

            let totals = {
                'SANTA FE': { obj: 0, ava: 0, pctG_sum: 0, count: 0 }, 
                'JUJUY': { obj: 0, ava: 0, pctG_sum: 0, count: 0 },
                'EXPRESS': { obj: 0, ava: 0, pctG_sum: 0, count: 0 }, 
                'MOVIL': { obj: 0, ava: 0, pctG_sum: 0, count: 0 }, 
                'TARTAGAL': { obj: 0, ava: 0, pctG_sum: 0, count: 0 },
                'CONSOLIDADO': { obj: 0, ava: 0, pctG_sum: 0, count: 0 }
            };

            filtered.forEach(r => {
                let sucKey = Object.keys(totals).find(k => r.sucursal.includes(k));
                if (sucKey) {
                    totals[sucKey].obj += r.objetivo; 
                    totals[sucKey].ava += r.avance;
                    totals[sucKey].pctG_sum += r.pctG; // Sumamos los % de Excel
                    totals[sucKey].count += 1;
                    
                    totals['CONSOLIDADO'].obj += r.objetivo; 
                    totals['CONSOLIDADO'].ava += r.avance;
                    totals['CONSOLIDADO'].pctG_sum += r.pctG;
                    totals['CONSOLIDADO'].count += 1;
                }
            });
            renderDashboard(totals);
        }

        function renderDashboard(totals) {
            let objHtml = '', avaHtml = '', desHtml = '';
            const sucursales = ['SANTA FE', 'JUJUY', 'EXPRESS', 'MOVIL', 'TARTAGAL'];

            sucursales.forEach(suc => {
                let obj = totals[suc].obj, ava = totals[suc].ava, des = ava - obj;
                if (obj > 0 || ava > 0 || currentFilters.sucursal === 'TODAS') {
                    objHtml += `<div class="list-item"><span>${suc}</span> <span class="list-val">${formatMoney(obj)}</span></div>`;
                    avaHtml += `<div class="list-item"><span>${suc}</span> <span class="list-val">${formatMoney(ava)}</span></div>`;
                    desHtml += `<div class="list-item"><span>${suc}</span> <span class="list-val">${formatMoney(des)}</span></div>`;
                }
            });

            let cObj = totals['CONSOLIDADO'].obj, cAva = totals['CONSOLIDADO'].ava, cDes = cAva - cObj;
            let consHtml = `<div class="list-item consolidado"><span>CONSOLIDADO</span> <span class="list-val consolidado-val">${formatMoney(cObj)}</span></div>`;
            
            document.getElementById('obj-list').innerHTML = objHtml + consHtml;
            document.getElementById('ava-list').innerHTML = avaHtml + consHtml.replace(formatMoney(cObj), formatMoney(cAva));
            document.getElementById('des-list').innerHTML = desHtml + consHtml.replace(formatMoney(cObj), formatMoney(cDes));

            document.getElementById('gauge-container').innerHTML = '';
            sucursales.forEach(suc => {
                let count = totals[suc].count;
                // Usamos el promedio de la columna G si hay datos, si no, se queda en 0
                let avgPctG = count > 0 ? (totals[suc].pctG_sum / count) : 0;
                
                if (totals[suc].obj > 0 || totals[suc].ava > 0 || currentFilters.sucursal === 'TODAS') {
                    createGauge(suc.replace(/\s+/g, ''), suc, avgPctG);
                }
            });
            
            // Consolidado Total también usa el promedio de la columna G
            let cCount = totals['CONSOLIDADO'].count;
            let cAvgPctG = cCount > 0 ? (totals['CONSOLIDADO'].pctG_sum / cCount) : 0;
            createGauge('total', 'CONSOLIDADO TOTAL', cAvgPctG);
        }

        function createGauge(id, name, pct) {
            let color = getStatusColor(pct);
            let colorClass = pct >= 95 ? 'text-green' : pct >= 90 ? 'text-yellow' : 'text-red';
            
            let html = `
                <div class="gauge-card">
                    <div class="gauge-info">
                        <h3>${name}</h3>
                        <p class="gauge-pct ${colorClass}">${pct.toFixed(0)}%</p>
                    </div>
                    <div class="chart-wrapper"><canvas id="gauge-${id}"></canvas></div>
                </div>`;
            document.getElementById('gauge-container').insertAdjacentHTML('beforeend', html);

            new Chart(document.getElementById(`gauge-${id}`).getContext('2d'), {
                type: 'doughnut',
                data: { datasets: [{ data: [pct > 100 ? 100 : pct, pct > 100 ? 0 : 100 - pct], backgroundColor: [color, 'rgba(255,255,255,0.05)'], borderWidth: 0, circumference: 180, rotation: 270 }] },
                options: { responsive: true, maintainAspectRatio: false, cutout: '75%', plugins: { tooltip: { enabled: false } }, hover: { mode: null } }
            });
        }

        document.querySelectorAll('.f-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                let val = e.target.getAttribute('data-val');
                let parentId = e.target.parentElement.id;
                document.querySelectorAll(`#${parentId} .f-btn`).forEach(b => b.classList.remove('active'));
                e.target.classList.add('active');

                if (parentId === 'filter-ano') currentFilters.ano = val;
                if (parentId === 'filter-sucursales') currentFilters.sucursal = val;
                if (parentId === 'filter-areas') currentFilters.area = val;
                if (parentId === 'filter-meses') currentFilters.mes = val;

                processData();
            });
        });

        fetch(scriptUrl).then(res => res.json()).then(data => {
            document.getElementById('loading').style.display = 'none';
            document.getElementById('dashboard').style.display = 'block';
            rawData = data.facturacionRaw;
            processData(); 
        });
    </script>
</body>
</html>
