<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Autosol VW - Posventa</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400;0,700;0,900;1,900&display=swap');
        
        body, html {
            margin: 0; padding: 0; height: 100%; font-family: 'Montserrat', sans-serif;
            background-color: #f4f7f6; color: #1e293b;
            /* Fondo de taller con capa blanca translúcida (estilo luminoso) */
            background-image: linear-gradient(rgba(244, 247, 246, 0.85), rgba(255, 255, 255, 0.95)), url('https://images.unsplash.com/photo-1613214149922-f1809c99b414?q=80&w=2070&auto=format&fit=crop');
            background-size: cover; background-position: center; display: flex; flex-direction: column; align-items: center; justify-content: center;
        }
        
        .header { text-align: center; margin-bottom: 40px; display: flex; flex-direction: column; align-items: center; }
        
        .vw-logo { width: 90px; margin-bottom: 15px; }
        
        .logo-title { font-size: 4.5rem; font-weight: 900; font-style: italic; letter-spacing: -2px; margin: 0; text-transform: uppercase; line-height: 1.1; }
        .text-dark { color: #001e50; } /* Azul oscuro corporativo VW */
        .text-blue { color: #00b0f0; } /* Azul claro vibrante */
        
        .subtitle { font-size: 1rem; letter-spacing: 6px; color: #64748b; text-transform: uppercase; border-top: 1px solid rgba(0,0,0,0.1); border-bottom: 1px solid rgba(0,0,0,0.1); padding: 8px 0; margin-top: 15px; display: inline-block; font-weight: 700; }

        .cards-container { display: flex; gap: 30px; flex-wrap: wrap; justify-content: center; max-width: 1200px; padding: 20px; }
        
        .card {
            background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(0, 0, 0, 0.05); border-radius: 20px; padding: 40px 30px; width: 300px;
            text-decoration: none; color: #1e293b; transition: all 0.3s ease; display: flex; flex-direction: column; box-shadow: 0 10px 30px rgba(0,0,0,0.05);
        }
        .card:hover { transform: translateY(-10px); background: #ffffff; border-color: #00b0f0; box-shadow: 0 20px 40px rgba(0, 176, 240, 0.15); }
        
        /* Nuevo estilo para los íconos: Cuadrado, fondo blanco, borde negro */
        .icon-box {
            width: 55px; height: 55px; background-color: #ffffff; border: 2px solid #1e293b; border-radius: 12px; 
            display: flex; align-items: center; justify-content: center; margin-bottom: 20px;
        }
        
        /* Estilo del dibujo del ícono */
        .icon-box svg { width: 30px; height: 30px; stroke: #1e293b; stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
        
        .card-title { font-size: 1.5rem; font-weight: 900; font-style: italic; margin: 0 0 5px 0; text-transform: uppercase; color: #001e50; }
        .card-subtitle { font-size: 0.8rem; color: #64748b; text-transform: uppercase; font-weight: 700; letter-spacing: 1px; margin: 0; }
        
        .footer { position: absolute; bottom: 20px; font-size: 0.7rem; color: #94a3b8; letter-spacing: 2px; }
    </style>
</head>
<body>

    <div class="header">
        <!-- Logo VW oficial actualizado -->
        <img src="https://upload.wikimedia.org/wikipedia/commons/6/6d/Volkswagen_logo_2019.svg" alt="Volkswagen Logo" class="vw-logo">
        
        <h1 class="logo-title"><span class="text-dark">AUTOSOL</span> <span class="text-blue">POSVENTA</span></h1>
        <div class="subtitle">SISTEMA DE GESTIÓN GERENCIAL</div>
    </div>

    <div class="cards-container">
        <!-- Tarjeta Operación -->
        <a href="ppt.html" class="card">
            <div class="icon-box">
                <!-- Ícono SVG (Dibujo Tuerca/Engranaje) -->
                <svg viewBox="0 0 24 24">
                    <circle cx="12" cy="12" r="3"></circle>
                    <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1Z"></path>
                </svg>
            </div>
            <h2 class="card-title">Operación</h2>
            <p class="card-subtitle">PPT & Performance</p>
        </a>

        <!-- Tarjeta Costos -->
        <a href="costos.html" class="card">
            <div class="icon-box">
                <!-- Ícono SVG (Dibujo Gráfico) -->
                <svg viewBox="0 0 24 24">
                    <path d="M3 3v18h18"></path>
                    <path d="m19 9-5 5-4-4-3 3"></path>
                </svg>
            </div>
            <h2 class="card-title">Costos</h2>
            <p class="card-subtitle">Utilidad & Gastos</p>
        </a>

        <!-- Tarjeta Facturación -->
        <a href="facturacion.html" class="card">
            <div class="icon-box">
                <!-- Ícono SVG (Dibujo Moneda/Dólar) -->
                <svg viewBox="0 0 24 24">
                    <line x1="12" y1="1" x2="12" y2="23"></line>
                    <path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path>
                </svg>
            </div>
            <h2 class="card-title">Facturación</h2>
            <p class="card-subtitle">Finanzas & Ventas</p>
        </a>
    </div>

    <div class="footer">
        © 2026 AUTOSOL VW · GESTIÓN PROFESIONAL DE CONCESIONARIOS
    </div>

</body>
</html>
