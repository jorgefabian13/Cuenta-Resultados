<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Dashboard Posventa - Proyecciones</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #f4f7f6; padding: 20px; color: #333; }
        .container { max-width: 1400px; margin: auto; }
        .header { text-align: center; margin-bottom: 20px; }
        .chart-container { background: white; padding: 20px; border-radius: 8px; margin-bottom: 30px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .table-container { background: white; padding: 20px; border-radius: 8px; margin-bottom: 30px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); overflow-x: auto; }
        h2 { color: #2c3e50; font-size: 18px; border-bottom: 2px solid #ecf0f1; padding-bottom: 10px; margin-top:0; }
        table { width: 100%; border-collapse: collapse; font-size: 13px; }
        th, td { padding: 10px; text-align: center; border-bottom: 1px solid #ddd; }
        th:first-child, td:first-child { text-align: left; font-weight: bold; min-width: 200px; }
        th { background: #f8f9fa; color: #2c3e50; }
        
        /* Colores Pastel Suaves para Costos Operativos */
        .sube { background-color: #f8d7da !important; color: #721c24 !important; font-weight: bold; border-radius: 4px; } 
        .verde { background-color: #d4edda !important; color: #155724 !important; font-weight: bold; border-radius: 4px; } 
        .estable { background-color: #fff3cd !important; color: #856404 !important; font-weight: bold; border-radius: 4px; } 
        .texto-proyectado { font-style: italic; opacity: 0.7; }
        
        #loading { text-align: center; font-size: 18px; color: #2980b9; font-weight: bold; padding: 50px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📊 Tablero Gerencial - Utilidad Operativa y Costos</h1>
        </div>
        
        <div id="loading">Sincronizando proyecciones móviles y mapa de calor... ⏳</div>
        
        <div id="dashboard" style="display:none;">
            <div class="chart-container">
                <h2>📈 Utilidad Operativa Después de Impuestos (Fila 103)</h2>
                <canvas id="combinedChart" height="80"></canvas>
            </div>

            <div class="table-container">
                <h2>🟡 Costos Controlables (Valores $ - Proyección Móvil a Dic)</h2>
                <div id="tabla-controlables"></div>
            </div>

            <div class="table-container">
                <h2>🔵 Costos No Controlables (Valores $ - Proyección Móvil a Dic)</h2>
                <div id="tabla-no-controlables"></div>
            </div>
        </div>
    </div>

    <script>
        // PEGA AQUÍ TU ENLACE TERMINADO EN /exec
        const scriptUrl ="https://script.google.com/macros/s/AKfycbyDV-LAoMQVORJfYptA6X6ozMgAvEzRiSyM17zJ-BBqNYDGEBP9kVia4i-vM64bDjdR/exec" 

        const formatMoney = (n) => new Intl.NumberFormat('es-AR', { style: 'currency', currency: 'ARS', maximumFractionDigits: 0 }).format(n);

        // Calcula hasta qué mes hay datos cargados globalmente para arrancar la proyección en bloque
        function getGlobalLastIdx(dataObj) {
            let maxIdx = -1;
            const items = [...dataObj.controlables, ...dataObj.noControlables];
            items.forEach(item => {
                for(let i=0; i<12; i++) {
                    if (item.data[i] !== null && item.data[i] !== undefined && item.data[i] !== 0) {
                        if (i > maxIdx) maxIdx = i;
                    }
                }
            });
            return maxIdx;
        }

        // Proyecta en base al último mes consolidado global
        function projectData(rawData, globalLastIdx) {
            let processed = [...rawData];
            let isProjected = Array(12).fill(false);
            
            for (let i = 0; i < 12; i++) {
                if (i > globalLastIdx) {
                    let sum = 0;
                    let count = 0;
                    if (i >= 1) { sum += processed[i-1]; count++; }
                    if (i >= 2) { sum += processed[i-2]; count++; }
                    if (i >= 3) { sum += processed[i-3]; count++; }
                    
                    processed[i] = count > 0 ? (sum / count) : 0;       
                    isProjected[i] = true;    
                } else if (processed[i] === null || processed[i] === undefined) {
                    processed[i] = 0;
                }
            }
            return { data: processed, isProjected: isProjected };
        }

        function buildTable(items, containerId, globalLastIdx) {
            if(!items || items.length === 0) return;
            const months = ['Ene', 'Feb', 'Mar', 'Abr', 'May', 'Jun', 'Jul', 'Ago', 'Sep', 'Oct', 'Nov', 'Dic'];
            let baseProj = projectData(items[0].data, globalLastIdx);
            
            let html = '<table><thead><tr><th>Concepto</th>';
            for (let i = 0; i < 12; i++) {
                let suffix = baseProj.isProjected[i] ? ' (P)' : '';
                html += `<th>${months[i]}${suffix}</th>`;
            }
            html += '</tr></thead><tbody>';
            
            items.forEach(item => {
                html += `<tr><td>${item.name}</td>`;
                let proj = projectData(item.data, globalLastIdx);
                let vals = proj.data;
                let isProj = proj.isProjected;
                
                for (let i = 0; i < 12; i++) {
                    let cssClass = '';
                    let val = vals[i];
                    
                    // Primero evaluamos el color del semáforo para TODOS los meses (Reales y Proyectados)
                    if (i > 0) {
                        let prevVal = vals[i-1];
                        if (prevVal !== 0) {
                            let ratio = val / prevVal;
                            if (ratio > 1.02) cssClass = 'sube'; 
                            else if (ratio < 0.98) cssClass = 'verde'; 
                            else cssClass = 'estable'; 
                        } else {
                            if (val > 0) cssClass = 'sube';
                            else if (val === 0) cssClass = 'estable';
                            else cssClass = 'verde';
                        }
                    }
                    
                    // Luego, si es proyección, le agregamos la cursiva al número (sin borrar el color de fondo)
                    if (isProj[i]) {
                        cssClass += ' texto-proyectado';
                    }
                    
                    html += `<td class="${cssClass.trim()}">${formatMoney(val)}</td>`;
                }
                html += '</tr>';
            });
            html += '</tbody></table>';
            document.getElementById(containerId).innerHTML = html;
        }

        fetch(scriptUrl)
            .then(res => res.json())
            .then(data => {
                document.getElementById('loading').style.display = 'none';
                document.getElementById('dashboard').style.display = 'block';

                let globalLastIdx = getGlobalLastIdx(data);

                buildTable(data.controlables, 'tabla-controlables', globalLastIdx);
                buildTable(data.noControlables, 'tabla-no-controlables', globalLastIdx);

                const utilVals = projectData(data.utilidadValores, globalLastIdx);
                const utilPcts = projectData(data.utilidadPorcentajes, globalLastIdx);
                const labelMeses = data.meses.map((mes, i) => utilVals.isProjected[i] ? mes + ' (P)' : mes);

                new Chart(document.getElementById('combinedChart').getContext('2d'), {
                    type: 'line',
                    data: {
                        labels: labelMeses,
                        datasets: [
                            {
                                type: 'bar',
                                label: 'Utilidad en $ (Eje Izq)',
                                data: utilVals.data,
                                backgroundColor: 'rgba(46, 204, 113, 0.7)',
                                yAxisID: 'y'
                            },
                            {
                                type: 'line',
                                label: 'Margen % (Eje Der)',
                                data: utilPcts.data,
                                borderColor: '#3498db',
                                backgroundColor: '#3498db',
                                borderWidth: 3,
                                tension: 0.3,
                                yAxisID: 'y1'
                            }
                        ]
                    },
                    options: {
                        responsive: true,
                        interaction: { mode: 'index', intersect: false },
                        scales: {
                            y: {
                                type: 'linear',
                                display: true,
                                position: 'left',
                                title: { display: true, text: 'Valores en $' },
                                ticks: { callback: function(value) { return formatMoney(value); } }
                            },
                            y1: {
                                type: 'linear',
                                display: true,
                                position: 'right',
                                title: { display: true, text: 'Porcentaje (%)' },
                                grid: { drawOnChartArea: false },
                                ticks: { callback: function(value) { return value + '%'; } }
                            }
                        },
                        plugins: {
                            tooltip: {
                                callbacks: {
                                    label: function(context) {
                                        let val = context.raw;
                                        if (context.datasetIndex === 0) return formatMoney(val); 
                                        return val.toFixed(2) + '%';
                                    }
                                }
                            }
                        }
                    }
                });
            });
    </script>
</body>
</html>
