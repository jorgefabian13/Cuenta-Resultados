<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Dashboard Posventa - Proyecciones</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #f4f7f6; padding: 20px; color: #333; }
        .container { max-width: 1400px; margin: auto; }
        .header { text-align: center; margin-bottom: 20px; }
        .chart-container { background: white; padding: 20px; border-radius: 8px; margin-bottom: 30px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .table-container { background: white; padding: 20px; border-radius: 8px; margin-bottom: 30px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); overflow-x: auto; }
        h2 { color: #2c3e50; font-size: 18px; border-bottom: 2px solid #ecf0f1; padding-bottom: 10px; margin-top:0; }
        table { width: 100%; border-collapse: collapse; font-size: 13px; }
        th, td { padding: 10px; text-align: center; border-bottom: 1px solid #ddd; }
        th:first-child, td:first-child { text-align: left; font-weight: bold; min-width: 200px; }
        th { background: #f8f9fa; color: #2c3e50; }
        .sube { background-color: #e74c3c !important; color: white !important; font-weight: bold; border-radius: 4px; }
        .baja { background-color: #f1c40f !important; color: black !important; font-weight: bold; border-radius: 4px; }
        .proyeccion { color: #7f8c8d !important; font-style: italic; background-color: #fafafa; }
        #loading { text-align: center; font-size: 18px; color: #2980b9; font-weight: bold; padding: 50px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📊 Tablero Gerencial - Utilidad Operativa y Costos</h1>
        </div>
        
        <div id="loading">Sincronizando proyecciones y mapa de calor... ⏳</div>
        
        <div id="dashboard" style="display:none;">
            <div class="chart-container">
                <h2>📈 Utilidad Operativa Después de Impuestos (Fila 103)</h2>
                <canvas id="combinedChart" height="80"></canvas>
            </div>

            <div class="table-container">
                <h2>🟡 Costos Controlables (Valores $ - Proyección a Dic)</h2>
                <div id="tabla-controlables"></div>
            </div>

            <div class="table-container">
                <h2>🔵 Costos No Controlables (Valores $ - Proyección a Dic)</h2>
                <div id="tabla-no-controlables"></div>
            </div>
        </div>
    </div>

    <script>
        // PEGA AQUÍ TU ENLACE TERMINADO EN /exec
        const scriptUrl = "https://script.google.com/macros/s/AKfycbyDV-LAoMQVORJfYptA6X6ozMgAvEzRiSyM17zJ-BBqNYDGEBP9kVia4i-vM64bDjdR/exec"

        const formatMoney = (n) => new Intl.NumberFormat('es-AR', { style: 'currency', currency: 'ARS', maximumFractionDigits: 0 }).format(n);

        // Calcula el promedio móvil de los últimos 3 meses con datos
        function projectData(rawData) {
            let processed = [...rawData];
            let lastIdx = -1;
            
            for (let i = 0; i < 12; i++) {
                if (processed[i] !== null && processed[i] !== undefined) {
                    lastIdx = i;
                }
            }
            
            let avg = 0;
            if (lastIdx >= 2) {
                avg = (processed[lastIdx] + processed[lastIdx-1] + processed[lastIdx-2]) / 3;
            } else if (lastIdx >= 0) {
                let sum = 0;
                for (let i = 0; i <= lastIdx; i++) sum += processed[i];
                avg = sum / (lastIdx + 1);
            }
            
            let isProjected = Array(12).fill(false);
            for (let i = 0; i < 12; i++) {
                if (i > lastIdx) {
                    processed[i] = avg;       
                    isProjected[i] = true;    
                } else if (processed[i] === null) {
                    processed[i] = 0;
                }
            }
            return { data: processed, isProjected: isProjected };
        }

        function buildTable(items, containerId) {
            if(!items || items.length === 0) return;
            const months = ['Ene', 'Feb', 'Mar', 'Abr', 'May', 'Jun', 'Jul', 'Ago', 'Sep', 'Oct', 'Nov', 'Dic'];
            let baseProj = projectData(items[0].data);
            
            let html = '<table><thead><tr><th>Concepto</th>';
            for (let i = 0; i < 12; i++) {
                let suffix = baseProj.isProjected[i] ? ' (P)' : '';
                html += `<th>${months[i]}${suffix}</th>`;
            }
            html += '</tr></thead><tbody>';
            
            items.forEach(item => {
                html += `<tr><td>${item.name}</td>`;
                let proj = projectData(item.data);
                let vals = proj.data;
                let isProj = proj.isProjected;
                
                for (let i = 0; i < 12; i++) {
                    let cssClass = '';
                    let val = vals[i];
                    
                    if (isProj[i]) {
                        cssClass = 'proyeccion';
                    } else if (i > 0) {
                        let prevVal = vals[i-1];
                        if (val > prevVal) cssClass = 'sube'; // Rojo si sube el costo
                        else if (val < prevVal) cssClass = 'baja'; // Amarillo si baja
                    }
                    html += `<td class="${cssClass}">${formatMoney(val)}</td>`;
                }
                html += '</tr>';
            });
            html += '</tbody></table>';
            document.getElementById(containerId).innerHTML = html;
        }

        fetch(scriptUrl)
            .then(res => res.json())
            .then(data => {
                document.getElementById('loading').style.display = 'none';
                document.getElementById('dashboard').style.display = 'block';

                buildTable(data.controlables, 'tabla-controlables');
                buildTable(data.noControlables, 'tabla-no-controlables');

                const utilVals = projectData(data.utilidadValores);
                const utilPcts = projectData(data.utilidadPorcentajes);
                const labelMeses = data.meses.map((mes, i) => utilVals.isProjected[i] ? mes + ' (P)' : mes);

                new Chart(document.getElementById('combinedChart').getContext('2d'), {
                    type: 'line',
                    data: {
                        labels: labelMeses,
                        datasets: [
                            {
                                type: 'bar',
                                label: 'Utilidad en $ (Eje Izq)',
                                data: utilVals.data,
                                backgroundColor: 'rgba(46, 204, 113, 0.7)',
                                yAxisID: 'y'
                            },
                            {
                                type: 'line',
                                label: 'Margen % (Eje Der)',
                                data: utilPcts.data,
                                borderColor: '#3498db',
                                backgroundColor: '#3498db',
                                borderWidth: 3,
                                tension: 0.3,
                                yAxisID: 'y1'
                            }
                        ]
                    },
                    options: {
                        responsive: true,
                        interaction: { mode: 'index', intersect: false },
                        scales: {
                            y: {
                                type: 'linear',
                                display: true,
                                position: 'left',
                                title: { display: true, text: 'Valores en $' },
                                ticks: { callback: function(value) { return formatMoney(value); } }
                            },
                            y1: {
                                type: 'linear',
                                display: true,
                                position: 'right',
                                title: { display: true, text: 'Porcentaje (%)' },
                                grid: { drawOnChartArea: false },
                                ticks: { callback: function(value) { return value + '%'; } }
                            }
                        },
                        plugins: {
                            tooltip: {
                                callbacks: {
                                    label: function(context) {
                                        let val = context.raw;
                                        if (context.datasetIndex === 0) return formatMoney(val); 
                                        return val.toFixed(2) + '%';
                                    }
                                }
                            }
                        }
                    }
                });
            });
    </script>
</body>
</html>
