<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Dashboard Gerencial Autosol</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #f4f7f6; padding: 20px; color: #333; }
        .container { max-width: 1200px; margin: auto; }
        .header { text-align: center; margin-bottom: 20px; }
        .kpi-row { display: flex; gap: 20px; margin-bottom: 20px; }
        .kpi-card { background: white; padding: 20px; border-radius: 8px; flex: 1; text-align: center; box-shadow: 0 4px 6px rgba(0,0,0,0.05); border-top: 5px solid #ccc; }
        .kpi-title { font-size: 14px; color: #7f8c8d; text-transform: uppercase; font-weight: bold; }
        .kpi-value { font-size: 28px; font-weight: bold; margin: 10px 0; }
        .kpi-sub { font-size: 12px; color: #95a5a6; }
        .charts-row { display: flex; gap: 20px; }
        .chart-box { background: white; padding: 20px; border-radius: 8px; flex: 1; box-shadow: 0 4px 6px rgba(0,0,0,0.05); min-width: 400px; }
        #loading { text-align: center; font-size: 18px; color: #2980b9; font-weight: bold; padding: 50px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📊 Tablero de Control Posventa</h1>
        </div>
        
        <div id="loading">Sincronizando con Google Sheets... ⏳</div>
        
        <div id="dashboard" style="display:none;">
            <!-- Tarjetas KPI -->
            <div class="kpi-row">
                <div class="kpi-card" id="card-ventas">
                    <div class="kpi-title">Facturación (Último Mes)</div>
                    <div class="kpi-value" id="val-ventas">$0</div>
                    <div class="kpi-sub" id="sub-ventas">Cargando...</div>
                </div>
                <div class="kpi-card" id="card-utilidad">
                    <div class="kpi-title">Cumplimiento Utilidad</div>
                    <div class="kpi-value" id="val-utilidad">$0</div>
                    <div class="kpi-sub" id="sub-utilidad">Objetivo 220M</div>
                </div>
                <div class="kpi-card" id="card-ppt">
                    <div class="kpi-title">Eficiencia PPT</div>
                    <div class="kpi-value" id="val-ppt">62%</div>
                    <div class="kpi-sub">Umbral mínimo 60%</div>
                </div>
            </div>

            <!-- Gráficos -->
            <div class="charts-row">
                <div class="chart-box">
                    <canvas id="mainChart"></canvas>
                </div>
                <div class="chart-box">
                    <canvas id="gastosChart"></canvas>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ¡IMPORTANTE! PEGA TU ENLACE DE APPS SCRIPT AQUÍ
        const scriptUrl ="https://script.google.com/macros/s/AKfycbyDV-LAoMQVORJfYptA6X6ozMgAvEzRiSyM17zJ-BBqNYDGEBP9kVia4i-vM64bDjdR/exec"
        const formatMoney = (n) => new Intl.NumberFormat('es-AR', { style: 'currency', currency: 'ARS', maximumFractionDigits: 0 }).format(n);

        fetch(scriptUrl)
            .then(res => res.json())
            .then(data => {
                document.getElementById('loading').style.display = 'none';
                document.getElementById('dashboard').style.display = 'block';

                const ultimoIndice = data.ventas.length - 1;
                
                // 1. KPI Ventas Totales
                document.getElementById('val-ventas').innerText = formatMoney(data.ventas[ultimoIndice]);
                document.getElementById('card-ventas').style.borderTopColor = '#3498db';
                document.getElementById('val-ventas').style.color = '#3498db';

                // 2. KPI Utilidad y Lógica de Colores de Cumplimiento
                const utilidadReal = data.utilidad[ultimoIndice];
                const utilidadObjetivo = 220000000; // Objetivo simulado para medir cumplimiento
                const porcentajeCumplimiento = (utilidadReal / utilidadObjetivo) * 100;
                
                document.getElementById('val-utilidad').innerText = porcentajeCumplimiento.toFixed(1) + '%';
                
                const cardUtilidad = document.getElementById('card-utilidad');
                const valUtilidad = document.getElementById('val-utilidad');
                
                if (porcentajeCumplimiento >= 95) {
                    cardUtilidad.style.borderTopColor = '#2ecc71'; valUtilidad.style.color = '#2ecc71'; // Verde
                } else if (porcentajeCumplimiento >= 90) {
                    cardUtilidad.style.borderTopColor = '#f1c40f'; valUtilidad.style.color = '#f1c40f'; // Amarillo
                } else {
                    cardUtilidad.style.borderTopColor = '#e74c3c'; valUtilidad.style.color = '#e74c3c'; // Rojo
                }

                // 3. KPI Eficiencia PPT (Umbral 60%)
                const eficienciaPPTActual = 62; // Valor de ejemplo, se puede enlazar al sheet luego
                const cardPPT = document.getElementById('card-ppt');
                const valPPT = document.getElementById('val-ppt');
                
                if (eficienciaPPTActual >= 60) {
                    cardPPT.style.borderTopColor = '#2ecc71'; valPPT.style.color = '#2ecc71'; // Verde
                } else {
                    cardPPT.style.borderTopColor = '#e74c3c'; valPPT.style.color = '#e74c3c'; // Rojo
                }

                // Gráfico Principal: Ventas vs Utilidad
                new Chart(document.getElementById('mainChart').getContext('2d'), {
                    type: 'bar',
                    data: {
                        labels: data.meses,
                        datasets: [
                            { type: 'line', label: 'Ventas', data: data.ventas, borderColor: '#3498db', tension: 0.3 },
                            { type: 'bar', label: 'Utilidad Operativa', data: data.utilidad, backgroundColor: 'rgba(46, 204, 113, 0.7)' }
                        ]
                    }
                });

                // Gráfico Secundario: Controlables vs Sueldos
                new Chart(document.getElementById('gastosChart').getContext('2d'), {
                    type: 'line',
                    data: {
                        labels: data.meses,
                        datasets: [
                            { label: 'Gtos. Controlables', data: data.controlables, borderColor: '#e74c3c', backgroundColor: 'rgba(231, 76, 60, 0.1)', fill: true },
                            { label: 'Sueldos', data: data.sueldos, borderColor: '#9b59b6' }
                        ]
                    }
                });
            })
            .catch(error => {
                document.getElementById('loading').innerText = 'Error de conexión.';
            });
    </script>
</body>
</html>
