<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Dashboard Posventa - Análisis Porcentual</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #f4f7f6; padding: 20px; color: #333; }
        .container { max-width: 1400px; margin: auto; }
        .header { text-align: center; margin-bottom: 20px; }
        .charts-row { display: flex; flex-wrap: wrap; gap: 20px; margin-bottom: 30px; }
        .chart-box { background: white; padding: 20px; border-radius: 8px; flex: 1; min-width: 450px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .table-container { background: white; padding: 20px; border-radius: 8px; margin-bottom: 30px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); overflow-x: auto; }
        h2 { color: #2c3e50; font-size: 18px; border-bottom: 2px solid #ecf0f1; padding-bottom: 10px; margin-top:0; }
        table { width: 100%; border-collapse: collapse; font-size: 13px; }
        th, td { padding: 10px; text-align: center; border-bottom: 1px solid #ddd; }
        th:first-child, td:first-child { text-align: left; font-weight: bold; min-width: 200px; }
        th { background: #f8f9fa; color: #2c3e50; }
        .sube { background-color: #e74c3c; color: white; font-weight: bold; border-radius: 4px; }
        .baja { background-color: #f1c40f; color: black; font-weight: bold; border-radius: 4px; }
        .proyeccion { color: #7f8c8d; font-style: italic; background-color: #fafafa; }
        #loading { text-align: center; font-size: 18px; color: #2980b9; font-weight: bold; padding: 50px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📊 Tablero de Análisis Porcentual - Total Sol</h1>
        </div>
        
        <div id="loading">Sincronizando porcentajes y proyecciones... ⏳</div>
        
        <div id="dashboard" style="display:none;">
            <div class="charts-row">
                <div class="chart-box">
                    <canvas id="ventasChart"></canvas>
                </div>
                <div class="chart-box">
                    <canvas id="utilidadChart"></canvas>
                </div>
            </div>

            <div class="table-container">
                <h2>🟡 KPIs Costos Controlables (Comparativo Mensual)</h2>
                <div id="tabla-controlables"></div>
            </div>

            <div class="table-container">
                <h2>🔵 KPIs Costos No Controlables (Comparativo Mensual)</h2>
                <div id="tabla-no-controlables"></div>
            </div>
        </div>
    </div>

    <script>
        // PEGA AQUÍ TU ENLACE TERMINADO EN /exec
        const scriptUrl ="https://script.google.com/macros/s/AKfycbyDV-LAoMQVORJfYptA6X6ozMgAvEzRiSyM17zJ-BBqNYDGEBP9kVia4i-vM64bDjdR/exec"
        function buildTable(items, containerId) {
            let html = '<table><thead><tr><th>Concepto</th>';
            const months = ['Ene', 'Feb', 'Mar', 'Abr', 'May', 'Jun', 'Jul', 'Ago (P)', 'Sep (P)', 'Oct (P)', 'Nov (P)', 'Dic (P)'];
            months.forEach(m => html += `<th>${m}</th>`);
            html += '</tr></thead><tbody>';
            
            items.forEach(item => {
                html += `<tr><td>${item.name}</td>`;
                
                // Promedio últimos 3 meses para proyectar hasta fin de año
                const d = item.data;
                const avg3 = (d[4] + d[5] + d[6]) / 3;
                const projected = [...d, avg3, avg3, avg3, avg3, avg3];
                
                projected.forEach((val, i) => {
                    let cssClass = '';
                    if (i > 0 && i <= 6) { 
                        if (val > projected[i-1]) cssClass = 'sube'; // Rojo si sube
                        else if (val < projected[i-1]) cssClass = 'baja'; // Amarillo si baja
                    } 
                    else if (i > 6) {
                        cssClass = 'proyeccion';
                    }
                    html += `<td class="${cssClass}">${val.toFixed(2)}%</td>`;
                });
                html += '</tr>';
            });
            html += '</tbody></table>';
            document.getElementById(containerId).innerHTML = html;
        }

        fetch(scriptUrl)
            .then(res => res.json())
            .then(data => {
                document.getElementById('loading').style.display = 'none';
                document.getElementById('dashboard').style.display = 'block';

                buildTable(data.controlables, 'tabla-controlables');
                buildTable(data.noControlables, 'tabla-no-controlables');

                new Chart(document.getElementById('ventasChart').getContext('2d'), {
                    type: 'line',
                    data: {
                        labels: data.meses,
                        datasets: [
                            { label: 'Ventas (%)', data: data.ventas, borderColor: '#3498db', tension: 0.3 },
                            { label: 'Costo de Ventas (%)', data: data.costoVentas, borderColor: '#e74c3c', tension: 0.3 }
                        ]
                    }
                });

                new Chart(document.getElementById('utilidadChart').getContext('2d'), {
                    type: 'line',
                    data: {
                        labels: data.meses,
                        datasets: [
                            { label: 'Utilidad Operativa (%)', data: data.utilidad, borderColor: '#2ecc71', backgroundColor: 'rgba(46, 204, 113, 0.1)', fill: true, tension: 0.3 }
                        ]
                    }
                });
            })
            .catch(error => {
                document.getElementById('loading').innerText = 'Error de conexión. Verifica el enlace.';
            });
    </script>
</body>
</html>
